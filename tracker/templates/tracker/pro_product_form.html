<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - Bendango Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:860px">
    <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap mb-4">
        <div>
            <div class="text-primary text-uppercase fw-bold small mb-2">Bendango Pro</div>
            <h1 class="h2 mb-1">{{ page_title }}</h1>
            <p class="text-muted mb-0">{{ profile.business_name }}</p>
        </div>
        <a href="{% url 'pro_products' %}" class="btn btn-outline-secondary">Retour au catalogue</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <form method="post">{% csrf_token %}
                <div class="row g-3">
                    {% for field in form %}
                    <div class="{% if field.name == 'name' or field.name == 'sale_url' or field.name == 'image_url' %}col-12{% else %}col-md-6{% endif %}">
                        {% if field.name == 'in_stock' %}
                        <div class="form-check mt-4">
                            {{ field }}
                            <label class="form-check-label fw-semibold">{{ field.label }}</label>
                        </div>
                        {% else %}
                        <label class="form-label fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% endif %}
                        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                    </div>
                    {% endfor %}
                </div>
                <button class="btn btn-primary mt-4" type="submit">{{ submit_label }}</button>
            </form>
        </div>
    </div>
</div>
<style>.card{border-radius:18px!important}</style>
</body>
</html>
