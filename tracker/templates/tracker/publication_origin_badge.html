<span data-publication-origin="{{ origin.kind }}" title="{{ origin.description }}" class="tag inline-flex items-center gap-1.5 {% if origin.kind == 'pro_verified' %}tag-success{% elif origin.kind == 'pro_unverified' %}tag-warning{% else %}tag-secondary{% endif %}">
  <svg class="size-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    {% if origin.kind == 'pro_verified' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>
    {% elif origin.kind == 'pro_unverified' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    {% else %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>{% endif %}
  </svg>
  {{ origin.label }}
</span>
