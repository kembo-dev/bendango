<div class="min-w-0" {% if field.errors %}data-field-error{% endif %}>
  <label for="{{ field.id_for_label }}" class="field-label font-semibold">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-xs text-slate-500 dark:text-slate-400">facultatif</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="field-help">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error">{% for error in field.errors %}<p class="text-sm text-red-700 dark:text-red-300" role="alert">{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
