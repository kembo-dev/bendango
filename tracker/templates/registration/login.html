<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Bendango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:620px">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="text-primary text-uppercase fw-bold small mb-2">Bendango</div>
            <h1 class="h3 mb-2">Connexion</h1>
            <p class="text-muted">Accédez à vos recherches et à vos demandes professionnelles.</p>
            <form method="post">{% csrf_token %}
                {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
                <div class="mb-3"><label class="form-label">Nom d'utilisateur</label><input type="text" name="username" class="form-control" autofocus required></div>
                <div class="mb-3"><label class="form-label">Mot de passe</label><input type="password" name="password" class="form-control" required></div>
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <button class="btn btn-primary w-100" type="submit">Se connecter</button>
            </form>
            <div class="text-center mt-3">Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></div>
        </div>
    </div>
</div>
</body>
</html>
